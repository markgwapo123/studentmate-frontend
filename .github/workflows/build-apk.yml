name: Build StudentMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build testing APK
        run: gradle --project-dir android-app assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: StudentMate-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Vercel download path
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/StudentMate.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/StudentMate.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish StudentMate testing APK'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
