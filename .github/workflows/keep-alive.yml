name: Keep StudentMate API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_EXTERNAL_URL: ${{ vars.RENDER_EXTERNAL_URL || secrets.RENDER_EXTERNAL_URL }}
    steps:
      - name: Check public health endpoint
        shell: bash
        run: |
          if [[ "$RENDER_EXTERNAL_URL" != https://* ]]; then
            echo 'Set repository variable RENDER_EXTERNAL_URL to the HTTPS Render service URL.'
            exit 1
          fi
          curl -fsS --max-time 60 "${RENDER_EXTERNAL_URL%/}/health"
