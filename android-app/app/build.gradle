plugins { id 'com.android.application' }

android {
    namespace 'com.studentmate.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.studentmate.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // A permanent signing identity is required for in-place APK updates.
    // Configure these four secrets in GitHub Actions; never commit a keystore.
    def storeFilePath = System.getenv('STUDENTMATE_KEYSTORE_PATH')
    def storePass = System.getenv('STUDENTMATE_KEYSTORE_PASSWORD')
    def keyAlias = System.getenv('STUDENTMATE_KEY_ALIAS')
    def keyPass = System.getenv('STUDENTMATE_KEY_PASSWORD')

    signingConfigs {
        if (storeFilePath && storePass && keyAlias && keyPass) {
            release {
                storeFile file(storeFilePath)
                storePassword storePass
                keyAlias keyAlias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (storeFilePath && storePass && keyAlias && keyPass) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
